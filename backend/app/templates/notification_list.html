{% for item in notifications %}<article class="card p-3 mb-2" data-notification-id="{{ item.id }}"><p>{{ item.message }}</p><p>{{ item.created_at|taipei }} · {{ 'Read' if item.read_at else 'Unread' }}{% if item.sut_id %} · <a href="/suts/{{ item.sut_id }}">SUT detail</a>{% endif %}</p>{% if not item.read_at %}<form method="post" action="/notifications/{{ item.id }}/read"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-outline-primary">Mark read</button></form>{% endif %}</article>{% else %}<p>No notifications.</p>{% endfor %}
