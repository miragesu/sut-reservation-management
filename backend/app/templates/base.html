<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}SUT Coordination{% endblock %}</title>
<link rel="stylesheet" href="/static/bootstrap.min.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/theme.css">
<script defer src="/static/bootstrap.bundle.min.js"></script>
<script defer src="/static/notifications.js"></script>
<script defer src="/static/app.js">
</script>
<script defer src="/static/coordination.js"></script>
</head>
<body class="{% block body_class %}{% endblock %}"{% if user %} data-user-id="{{ user.id }}"{% endif %}>
<a class="visually-hidden-focusable" href="#main-content">Skip to content</a>
<nav class="navbar navbar-expand bg-dark navbar-dark">
<div class="container flex-wrap gap-3">
<a class="navbar-brand" href="/">SUT Coordination</a>
{% if user %}
<a class="text-white" href="/my-suts">My SUTs</a>
<a class="text-white" href="/calendar">Calendar</a>
<a class="text-white" href="/history">History</a>
<a class="text-white inbox-link" href="/notifications" aria-label="Notification center">Inbox <span id="unread-count" class="inbox-count" aria-live="polite" hidden></span></a>
{% if user.role != 'user' %}<a class="text-white" href="/admin">Admin</a>{% endif %}
<div class="ms-auto d-flex align-items-center gap-2" aria-label="Account actions">
<a class="btn btn-outline-light" href="/profile">Profile</a>
<form method="post" action="/logout" class="m-0">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button class="btn btn-outline-light">Sign out</button>
</form></div>{% endif %}</div>
</nav>
<main id="main-content" class="container py-4">{% block content %}{% endblock %}</main>
<footer class="container py-4 text-secondary">All times are Taipei time (UTC+8). Recorded status is advisory. This application does not control hardware access.</footer>
</body>
</html>
