<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}SUT Coordination{% endblock %}</title>
<link rel="stylesheet" href="/static/bootstrap.min.css">
<link rel="stylesheet" href="/static/app.css">
<script defer src="/static/app.js">
</script>
</head>
<body>
<nav class="navbar navbar-expand bg-dark navbar-dark">
<div class="container flex-wrap gap-3">
<a class="navbar-brand" href="/">SUT Coordination</a>
{% if user %}<a class="text-white" href="/labs">Labs</a>
<a class="text-white" href="/suts">Inventory</a>
<a class="text-white" href="/profile">Profile</a>
{% if user.role != 'user' %}<a class="text-white" href="/admin">Admin</a>{% endif %}
<form method="post" action="/logout" class="ms-auto">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button class="btn btn-outline-light">Sign out</button>
</form>{% endif %}</div>
</nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<footer class="container py-4 text-secondary">Asia/Taipei (UTC+08:00) · Recorded status is advisory. This application does not control hardware access.</footer>
</body>
</html>
