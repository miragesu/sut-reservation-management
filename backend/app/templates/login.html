{% extends 'base.html' %}{% block content %}<div class="auth-form">
<h1>Sign in</h1>
<p>Accounts are issued by your Super Admin.</p>
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="form-label" for="username">Username</label>
<input class="form-control mb-3" id="username" name="username" required maxlength="80" autocomplete="username">
<label class="form-label" for="password">Password</label>
<input class="form-control mb-3" id="password" name="password" type="password" required autocomplete="current-password">
<button class="btn btn-primary">Sign in</button>
</form>
</div>{% endblock %}
