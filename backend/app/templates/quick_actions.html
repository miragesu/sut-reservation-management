<div class="d-flex flex-wrap gap-2" aria-label="Actions for {{ sut.name }}">
{% for action in ['Claim','Queue','Reserve','Detail'] %}<button type="button" class="btn btn-sm btn-outline-primary" data-quick-action="{{ action|lower }}"{% if action != "Detail" and sut.operational_state != "normal" %} disabled{% endif %} data-quick-sut="{{ sut.id }}" data-sut-name="{{ sut.name }}">{{ 'Start using' if action == 'Claim' else action }}</button>{% endfor %}</div>
