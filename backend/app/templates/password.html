{% extends 'base.html' %}{% block content %}<div class="auth-form">
<h1>Change password</h1>{% if user.must_change_password %}<p role="alert">You must replace your administrator-issued password before accessing the application.</p>{% endif %}<form method="post" action="/change-password">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="current_password" class="form-label">Current password</label>
<input class="form-control mb-3" id="current_password" name="current_password" type="password" required autocomplete="current-password">
<label for="new_password" class="form-label">New password ({{ password_minimum }}–128 characters)</label>
<input class="form-control mb-3" id="new_password" name="new_password" type="password" required minlength="{{ password_minimum }}" maxlength="128" autocomplete="new-password">
<button class="btn btn-primary">Save and sign out all sessions</button>
</form>
</div>{% endblock %}
