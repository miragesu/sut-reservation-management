{% extends 'base.html' %}{% block content %}<h1>Reservation calendar</h1><p>Asia/Taipei day/week agenda. Historical, cancelled and no-show states remain visible.</p>
<form method="get" class="row g-2 mb-3"><div class="col-12 col-sm-3"><label for="day">Starting date</label><input class="form-control" id="day" name="day" type="date" value="{{ day.isoformat() }}" required></div><div class="col-12 col-sm-3"><label for="view">View</label><select class="form-select" id="view" name="view"><option value="day" {% if view == 'day' %}selected{% endif %}>Day</option><option value="week" {% if view == 'week' %}selected{% endif %}>Week</option></select></div><div class="col-12 col-sm-3"><label for="calendar-sut">SUT ID</label><input class="form-control" id="calendar-sut" name="sut_id" type="number" min="1" value="{{ filters.sut_id or '' }}"></div><div class="col-12 col-sm-3 align-self-end"><button class="btn btn-primary">Show calendar</button></div></form>
{% include 'reservation_rows.html' %}{% include 'pagination.html' %}{% endblock %}
