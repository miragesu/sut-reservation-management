# Production DEP-009: image only; no source checkout or build tooling required.
services:
  sut-management:
    # Installer resolves this version to an audited digest in its local lock override.
    image: "mirage315/sut-reservation-management:${SUT_VERSION:-stable}"
    platform: linux/amd64
    user: "10001:10001"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5088}:80"
    environment:
      APP_ENV: production
      SECRET_KEY: "${SECRET_KEY:?Generate a random SECRET_KEY locally}"
      DATABASE_URL: sqlite:////app/data/sut.db
      LOW_SECURITY_PASSWD: "${LOW_SECURITY_PASSWD:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      TZ: Asia/Taipei
      DEADLINE_PROCESSOR_ENABLED: "true"
      DEADLINE_POLL_SECONDS: "${DEADLINE_POLL_SECONDS:-1}"
    volumes:
      - type: bind
        source: /data/sut-reservation-data
        target: /app/data
        bind:
          create_host_path: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Namespaced to this container's private network; never change the host sysctl.
    # Allows UID 10001 to bind 80 without NET_BIND_SERVICE or file capabilities.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "80"
    stop_grace_period: 15s
