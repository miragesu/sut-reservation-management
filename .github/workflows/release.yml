name: Publish versioned Docker Hub image
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Existing official version to approve as stable (e.g. 1.0.1)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dockerhub-release
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name == 'push' && github.repository == 'miragesu/sut-reservation-management'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a release commit already merged into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        name: Validate version tag
        run: python3 scripts/release_version.py
  checks:
    needs: version
    uses: ./.github/workflows/day1.yml
    permissions:
      contents: read
  publish:
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check registry secret configuration without printing values
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          if [ "$DOCKERHUB_USERNAME" != mirage315 ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Configure DOCKERHUB_USERNAME=mirage315 and a scoped DOCKERHUB_TOKEN in GitHub Actions secrets.'
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: mirage315/sut-reservation-management
          flavor: latest=false
          tags: type=raw,value=${{ needs.version.outputs.version }}
      - name: Build and load the Linux amd64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate candidate using image-only Compose without a source checkout
        env:
          SUT_SMOKE_IMAGE: mirage315/sut-reservation-management:${{ needs.version.outputs.version }}
        run: python scripts/container_smoke.py
      - name: Refuse to overwrite any existing explicit version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/registry_release.py require-absent "$VERSION"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish version and immutable digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Pull and validate the published immutable digest
        env:
          SUT_SMOKE_IMAGE: mirage315/sut-reservation-management@${{ steps.push.outputs.digest }}
          SUT_SMOKE_PULL: '1'
          DOCKER_CONFIG: ${{ runner.temp }}/dockerhub-anonymous
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          python scripts/container_smoke.py
      - name: Record deployable digest and provenance
        env:
          IMAGE: mirage315/sut-reservation-management@${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf 'Image: `%s`\n\nVersion: `%s`\n\nSource commit: `%s`\n\nPublished digest pull and deployment validation: PASS\n' "$IMAGE" "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  latest:
    needs: [version, publish]
    if: ${{ !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote validated official digest to latest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          docker buildx imagetools create --tag mirage315/sut-reservation-management:latest "mirage315/sut-reservation-management@$DIGEST"
          test "$(python3 scripts/registry_release.py resolve latest)" = "$DIGEST"
          printf 'Latest promoted to `%s` after published-digest validation.\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  stable:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'miragesu/sut-reservation-management' && vars.STABLE_PROMOTION_ENABLED == 'true'
    # Configure required reviewers and prevent self-review BEFORE using this job.
    environment: dockerhub-stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve approved official version
        id: approved
        env:
          VERSION: ${{ inputs.stable_version }}
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"scripts"); from release_version import version_from_ref; v=version_from_ref("refs/tags/v"+os.environ["VERSION"]); assert "-" not in v, "Stable requires an official version"'
          DIGEST=$(python3 scripts/registry_release.py resolve "$VERSION")
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
          docker pull "mirage315/sut-reservation-management@$DIGEST"
          SOURCE=$(docker image inspect "mirage315/sut-reservation-management@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          git merge-base --is-ancestor "$SOURCE" origin/main
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Validate approved public digest before stable promotion
        env:
          SUT_SMOKE_IMAGE: mirage315/sut-reservation-management@${{ steps.approved.outputs.digest }}
          SUT_SMOKE_PULL: '1'
          DOCKER_CONFIG: ${{ runner.temp }}/stable-anonymous
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          python scripts/container_smoke.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote approved validated digest to stable
        env:
          DIGEST: ${{ steps.approved.outputs.digest }}
          VERSION: ${{ inputs.stable_version }}
        run: |
          docker buildx imagetools create --tag mirage315/sut-reservation-management:stable "mirage315/sut-reservation-management@$DIGEST"
          test "$(python3 scripts/registry_release.py resolve stable)" = "$DIGEST"
          printf 'Stable explicitly approved: `%s` / `%s`.\n' "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
