name: Publish versioned Docker Hub image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: dockerhub-release
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'miragesu/sut-reservation-management'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a release commit already merged into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: version
        name: Validate version tag
        run: python3 scripts/release_version.py
  checks:
    needs: version
    uses: ./.github/workflows/day1.yml
    permissions:
      contents: read
  publish:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check registry secret configuration without printing values
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          if [ "$DOCKERHUB_USERNAME" != mirage315 ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo '::error::Configure DOCKERHUB_USERNAME=mirage315 and a scoped DOCKERHUB_TOKEN in GitHub Actions secrets.'
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: mirage315/sut-reservation-management
          flavor: latest=false
          tags: type=raw,value=${{ needs.version.outputs.version }}
      - name: Build and load the Linux amd64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate candidate using image-only Compose without a source checkout
        env:
          SUT_SMOKE_IMAGE: mirage315/sut-reservation-management:${{ needs.version.outputs.version }}
        run: python scripts/container_smoke.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish version and immutable digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Pull and validate the published immutable digest
        env:
          SUT_SMOKE_IMAGE: mirage315/sut-reservation-management@${{ steps.push.outputs.digest }}
          SUT_SMOKE_PULL: '1'
          DOCKER_CONFIG: ${{ runner.temp }}/dockerhub-anonymous
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          python scripts/container_smoke.py
      - name: Record deployable digest and provenance
        env:
          IMAGE: mirage315/sut-reservation-management@${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf 'Image: `%s`\n\nVersion: `%s`\n\nSource commit: `%s`\n\nPublished digest pull and deployment validation: PASS\n' "$IMAGE" "$VERSION" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
