name: Application checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: ruff check backend scripts tests/console_mock
      - name: Check Console module syntax
        run: |
          for file in backend/app/static/console-*.js; do
            node --input-type=module --check < "$file"
          done
      - run: bash -n setup.sh
      - run: pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - run: python scripts/browser_day2.py
      - run: python scripts/browser_day3.py
      - name: Build and validate source; retain the tested image locally
        env:
          SUT_SMOKE_EXPORT_IMAGE: mirage315/sut-reservation-management:ci-${{ github.sha }}
        run: python scripts/container_smoke.py
      - name: Verify isolated Console Broker, OpenSSH and tmux (no production endpoints)
        run: |
          docker tag mirage315/sut-reservation-management:ci-${{ github.sha }} sut-console001-c:local
          SUT_CONSOLE_BROWSER=1 python scripts/console_mock_smoke.py
      - name: Verify Console image-only deployment and compatible pre-upgrade rollback
        run: |
          docker tag mirage315/sut-reservation-management:ci-${{ github.sha }} sut-console001-e:local
          git fetch --no-tags origin 00776f9b4b3bd4b7ee468899a9832b1036c1afd8
          previous_context=$(mktemp -d)
          git archive 00776f9b4b3bd4b7ee468899a9832b1036c1afd8 | tar -x -C "$previous_context"
          docker build -t sut-console001-e:previous "$previous_context"
          rm -rf "$previous_context"
          python scripts/console_deployment_smoke.py
      - name: Validate operator image-only Compose without build or checkout
        env:
          SUT_SMOKE_IMAGE: mirage315/sut-reservation-management:ci-${{ github.sha }}
          SUT_SMOKE_LOW_SECURITY: '1'
        run: python scripts/container_smoke.py
      - name: Rehearse installer fresh setup, rerun and backup upgrade in disposable directories
        env:
          SUT_INSTALLER_TEST_IMAGE: mirage315/sut-reservation-management:ci-${{ github.sha }}
        run: python scripts/installer_smoke.py
